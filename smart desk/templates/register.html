<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Register - Smart Parking</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- Top Dark Navy Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="/" class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Smart Parking</h1>
          <p>IoT IR Sensor System</p>
        </div>
      </a>
      <a href="/" class="btn-header" style="background: rgba(255,255,255,0.15);">Back</a>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Create Account</h2>
          <p>Sign up to book parking desks in real-time</p>
        </div>

        <div id="authAlert" style="display:none; padding:0.75rem 1rem; border-radius:8px; margin-bottom:1.25rem; font-size:0.875rem; font-weight:600;"></div>

        <form id="registerForm">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus placeholder="Choose a username (3-30 chars)">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" autocomplete="new-password" required placeholder="Choose a secure password (min 6 chars)">
          </div>

          <button type="submit" id="btnSubmit" class="btn-primary" style="width:100%; padding:0.85rem; margin-top:0.5rem;">
            Create Account
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="/login">Log in here</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <p>Smart Parking System &bull; Local LAN Access</p>
  </footer>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('authAlert');
      const submitBtn = document.getElementById('btnSubmit');
      alertBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').getAttribute('content')
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Registration failed');
        }

        alertBox.style.display = 'block';
        alertBox.style.background = '#d1fae5';
        alertBox.style.color = '#065f46';
        alertBox.textContent = data.message || 'Registration successful! Redirecting...';

        setTimeout(() => {
          window.location.href = '/';
        }, 500);
      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#991b1b';
        alertBox.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
